<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pre-paint theme: apply the saved light/dark choice before anything
      // renders so there is never a white flash. Same key as next-themes.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("ff-theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FilmFlix — Stream Movies</title>
    <meta
      name="description"
      content="FilmFlix — a modern movie streaming and catalog web app."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Ad loading rules:
         1. Admin panel (/nazmul) never loads ads.
         2. Sign-in (/auth) never loads ads either, and is always opened as a
            fresh document: this network's popunder hijacks the visitor's next
            click, and on /auth that next click is the login button.
         3. Installed app (standalone PWA): ads load automatically shortly
            after start — tap-gating is unreliable inside installed apps.
         4. Normal browser: ads load on the visitor's first click. -->
    <script>
      (function () {
        var loaded = false;
        var sources = [
          "https://pl31399024.profitableratecpmnetwork.com/58/9f/08/589f08c391e9982b3b86ceba9e5daa0c.js",
        ];
        var AD_SCRIPT_ATTR = "data-ff-ad";
        var CLEAN_AUTH_FLAG = "ff-auth-clean";

        function isAdminPath() {
          return window.location.pathname.indexOf("/nazmul") === 0;
        }
        /* The sign-in page is ad-free as well. This network injects a popunder
           that hijacks the visitor's *next* click, and on /auth that next click
           is the login button — which is why "Continue as guest" / "Google"
           looked like they did nothing at all. */
        function isAuthPath() {
          return window.location.pathname.indexOf("/auth") === 0;
        }
        function isAdFreePath() {
          return isAdminPath() || isAuthPath();
        }
        function isStandalone() {
          return (
            (window.matchMedia &&
              window.matchMedia("(display-mode: standalone)").matches) ||
            window.navigator.standalone === true
          );
        }
        /* Ad scripts already injected cannot be unloaded: their click handlers
           survive every client-side route change inside the SPA. The network
           also deletes its own <script> node once it has run, so the injection
           flag — not the DOM — is the reliable signal. */
        function hasResidentAds() {
          return (
            loaded || !!document.querySelector("script[" + AD_SCRIPT_ATTR + "]")
          );
        }
        function loadAds() {
          if (loaded || isAdFreePath()) return;
          loaded = true;
          document.removeEventListener("click", onFirstClick, true);
          for (var i = 0; i < sources.length; i++) {
            var s = document.createElement("script");
            s.src = sources[i];
            s.async = true;
            s.setAttribute(AD_SCRIPT_ATTR, "1");
            document.head.appendChild(s);
          }
        }
        /* Every route into /auth has to be a fresh document, otherwise the
           popunder eats the login click. Take the click over before the ad
           network (or the router) can see it and load the page ourselves. */
        function authHrefFor(node) {
          var a = node && node.closest ? node.closest("a[href]") : null;
          if (!a) return null;
          var href = a.getAttribute("href") || "";
          return /(^|\/)auth(\?|$|\/)/.test(href) ? a.href : null;
        }
        function onFirstClick(e) {
          if (
            e.target &&
            e.target.closest &&
            e.target.closest(
              '[data-slot="persistent-video-wrap"], .group\\/player'
            )
          ) {
            return; // ignore player clicks for ad-start purposes
          }
          loadAds();
        }
        window.addEventListener(
          "click",
          function (e) {
            var href = authHrefFor(e.target);
            if (!href) return;
            e.preventDefault();
            e.stopImmediatePropagation();
            window.location.assign(href);
          },
          true,
        );

        /* A client-side hop (e.g. the router bouncing a signed-out visitor away
           from /dashboard) leaves the ad scripts resident. Reload once so the
           sign-in page starts clean; the flag stops an endless loop. */
        function ensureCleanAuthDocument() {
          if (!hasResidentAds()) return;
          try {
            if (sessionStorage.getItem(CLEAN_AUTH_FLAG) === "1") return;
            sessionStorage.setItem(CLEAN_AUTH_FLAG, "1");
          } catch (e) {}
          window.location.reload();
        }
        function onRouteChange() {
          if (!isAuthPath()) {
            try {
              sessionStorage.removeItem(CLEAN_AUTH_FLAG);
            } catch (e) {}
          }
          if (!isAdFreePath()) {
            loadAds();
            return;
          }
          ensureCleanAuthDocument();
        }
        var pushState = history.pushState;
        var replaceState = history.replaceState;
        history.pushState = function () {
          var result = pushState.apply(this, arguments);
          onRouteChange();
          return result;
        };
        history.replaceState = function () {
          var result = replaceState.apply(this, arguments);
          onRouteChange();
          return result;
        };
        window.addEventListener("popstate", onRouteChange);
        if (!isAuthPath()) {
          try {
            sessionStorage.removeItem(CLEAN_AUTH_FLAG);
          } catch (e) {}
        }

        if (isAdFreePath()) {
          // Started on an ad-free route: hold ads off; enable them only if
          // the user navigates into the public site (SPA, same page).
          window.setInterval(onRouteChange, 800);
        } else if (isStandalone()) {
          // Installed app: show ads right away, no tap needed.
          setTimeout(loadAds, 1500);
        } else {
          // Ads load on the visitor's first click — but never count clicks
          // inside the video player: a stray tap on the picture would fire
          // the ad network right as playback starts, and those networks
          // respond with popunders/redirects that yank the user off the
          // movie page (the classic "video stops playing" complaint).
          document.addEventListener("click", onFirstClick, true);
        }
      })();
    </script>
    <style>
      /* Pre-React branded splash: paints instantly, replaced by the app.
         Both light and dark looks are styled here; the pre-paint script
         above picks one before the first frame. */
      html {
        background: #f7f5f1;
      }
      html.dark {
        background: #0b0b14;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(560px 320px at 50% 28%, rgba(225, 29, 72, 0.1), transparent 70%),
          #f7f5f1;
        transition: opacity 0.35s ease;
      }
      html.dark #boot-splash {
        background:
          radial-gradient(560px 320px at 50% 28%, rgba(225, 29, 72, 0.14), transparent 70%),
          #0b0b14;
      }
      #boot-splash.ff-hide {
        opacity: 0;
        pointer-events: none;
      }
      .ff-logo {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #f43f5e, #be123c);
        box-shadow: 0 12px 48px -12px rgba(225, 29, 72, 0.65);
        animation: ff-float 2.2s ease-in-out infinite;
      }
      .ff-logo::after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 22px;
        border: 2px solid rgba(225, 29, 72, 0.4);
        animation: ff-ring 2s ease-out infinite;
      }
      .ff-logo svg {
        width: 30px;
        height: 30px;
      }
      .ff-word {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.02em;
        color: #2a2434;
      }
      html.dark .ff-word {
        color: #fafafa;
      }
      .ff-word span {
        color: #fb7185;
      }
      .ff-bar {
        position: relative;
        width: 180px;
        height: 4px;
        border-radius: 999px;
        background: rgba(35, 25, 45, 0.1);
        overflow: hidden;
      }
      html.dark .ff-bar {
        background: rgba(255, 255, 255, 0.08);
      }
      .ff-bar::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #fb7185, transparent);
        animation: ff-slide 1.2s ease-in-out infinite;
      }
      @keyframes ff-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes ff-ring {
        0% { transform: scale(0.9); opacity: 0.8; }
        100% { transform: scale(1.25); opacity: 0; }
      }
      @keyframes ff-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <div class="ff-logo">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Z"
            stroke="#ffffff"
            stroke-width="1.8"
          />
          <path d="M4 9h16M9.5 3.5v5.2M14.5 3.5v5.2" stroke="#ffffff" stroke-width="1.8" />
          <path d="m11 13.2 4 2.3-4 2.3v-4.6Z" fill="#ffffff" />
        </svg>
      </div>
      <div class="ff-word">Film<span>Flix</span></div>
      <div class="ff-bar"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fade the splash away once the React app has mounted.
      (function () {
        var splash = document.getElementById("boot-splash");
        if (!splash) return;
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          splash.classList.add("ff-hide");
          setTimeout(function () {
            splash.remove();
          }, 400);
        }
        // As soon as the app renders anything into #root, fade out.
        var observer = new MutationObserver(function () {
          if (document.getElementById("root").childElementCount > 0) {
            observer.disconnect();
            hide();
          }
        });
        observer.observe(document.getElementById("root"), { childList: true });
        // Safety: never show it longer than 4s even if something fails.
        setTimeout(hide, 4000);
      })();
    </script>
  </body>
</html>
