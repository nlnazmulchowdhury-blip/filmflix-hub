# FilmFlix Relay — Nginx site config
# 1) Copy:   sudo cp nginx-relay.conf /etc/nginx/sites-available/relay
#    Edit server_name to your domain, then:
# 2) Enable: sudo ln -s /etc/nginx/sites-available/relay /etc/nginx/sites-enabled/relay
# 3) Test:   sudo nginx -t && sudo systemctl reload nginx
# 4) HTTPS:  sudo certbot --nginx -d tv.example.com
#    (certbot rewrites this file to add TLS + redirect automatically)

server {
    listen 80;
    listen [::]:80;
    server_name tv.example.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;

        # Relay derives the public URL from these:
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Stream bytes as they arrive; the relay does its own segment caching.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}